<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cashier</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--ac:#0f766e;--on:#fff;--bd:#e1e5ea;--rd:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101317;--card:#1a1f26;--tx:#eceff3;--mu:#9aa3af;--ac:#2dd4bf;--on:#06201c;--bd:#2b323c;--rd:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101317;--card:#1a1f26;--tx:#eceff3;--mu:#9aa3af;--ac:#2dd4bf;--on:#06201c;--bd:#2b323c;--rd:#f87171;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Naskh Arabic",Tahoma,sans-serif}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
header b{flex:1;font-size:17px}nav{display:flex;gap:6px}
.chip{font-size:12px;color:var(--mu)}
button,input{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 13px;cursor:pointer}
button.on,button.pri{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
input{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input[type=checkbox]{width:auto}input[type=number],#pc{direction:ltr}
main{max-width:1100px;margin:0 auto;padding:12px}
.grid{display:grid;gap:12px}@media(min-width:800px){.grid{grid-template-columns:1.2fr 1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}.grid .card{margin:0}
.row{display:flex;gap:8px;margin-bottom:10px}
.mu,small{color:var(--mu)}small{display:block;font-size:12.5px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pb{text-align:start;display:flex;flex-direction:column;gap:2px;min-height:62px}
.ln{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.qt{display:flex;align-items:center;gap:6px}.qt button{padding:4px 11px}
.lt{font-weight:600;text-align:end}.x{color:var(--rd)}
.tr{display:flex;justify-content:space-between;align-items:center;margin:8px 0;gap:8px}
.big{font-size:26px;font-weight:700}
#reader{width:100%;max-width:420px;margin:0 auto 8px;border-radius:12px;overflow:hidden}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.f .w{grid-column:1/-1}.f label>small{margin-bottom:3px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}.tile b{font-size:18px}
.per{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.wg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.wg button{padding:14px 4px;font-size:17px}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
[hidden]{display:none!important}
.mbox{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:380px;max-height:90%;overflow:auto}
.r{display:flex;justify-content:space-between;gap:10px;margin:3px 0}
textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px;font:12px monospace;direction:ltr}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;z-index:30}
@media print{body *{visibility:hidden}#rcp,#rcp *{visibility:visible}#rcp{position:absolute;left:0;top:0;width:100%;color:#000}}
nav{width:100%;overflow-x:auto}nav button{white-space:nowrap}
select{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;width:100%;font:inherit}
#lowbar{background:#f59e0b22;border:1px solid #f59e0b;border-radius:10px;padding:8px 10px;margin-bottom:10px;font-size:13.5px}
#lblSheet{display:none}.lb{border:1px dashed #999;padding:4px;text-align:center;font-size:11px;break-inside:avoid}.lb svg{max-width:100%}
@media print{#lblSheet.show{display:grid;grid-template-columns:repeat(3,1fr);gap:6mm;position:absolute;left:0;top:0;width:100%;background:#fff;color:#000}#lblSheet.show,#lblSheet.show *{visibility:visible}}
</style></head><body>
<header><b id="sn">Cashier</b><span class="chip" id="sync"></span><button id="lang">کوردی</button>
<nav><button data-v="sell" data-i="sell" class="on"></button><button data-v="prod" data-i="prods"></button><button data-v="debts" data-i="debts"></button><button data-v="cash" data-i="cash"></button><button data-v="sales" data-i="recs"></button></nav></header>
<main>
<div id="cam" class="card" hidden><div id="reader"></div><button id="camStop" data-i="stop"></button></div>

<section id="v-sell" class="grid">
 <div>
  <div class="row"><input id="q" data-p="search" autocomplete="off"><button id="scanBtn" class="pri" data-i="scan"></button><button id="photoBtn" data-i="photo"></button><input type="file" id="pf" accept="image/*" capture="environment" hidden></div>
  <div id="lowbar" hidden></div><div id="list" class="plist"></div>
 </div>
 <div class="card">
  <div id="lines"></div>
  <div class="tr"><span data-i="disc"></span><input id="disc" type="number" inputmode="decimal" min="0" style="max-width:140px" placeholder="0"></div>
  <div class="tr"><span data-i="total"></span><span class="big" id="tot">0</span></div>
  <div class="tr"><span data-i="recv"></span><input id="paid" type="number" inputmode="decimal" min="0" style="max-width:140px" data-p="exact"></div>
  <div class="tr"><span data-i="chg"></span><b id="chg">—</b></div>
  <div class="row" style="margin:10px 0 0"><button id="clr" data-i="clear"></button><button id="cred" data-i="cred"></button><button id="pay" class="pri" style="flex:1;padding:13px" data-i="pay"></button></div>
 </div>
</section>

<section id="v-prod" hidden>
 <div class="card">
  <input id="pid" type="hidden">
  <div class="f">
   <label class="w"><small data-i="code"></small><div class="row" style="margin:0"><input id="pc"><button id="pscan">📷</button><button id="pphoto">🖼</button></div></label>
   <label class="w"><small data-i="name"></small><input id="pn"></label>
   <label><small id="lc"></small><input id="pk" type="number" inputmode="decimal" min="0"></label>
   <label><small id="lp"></small><input id="pp" type="number" inputmode="decimal" min="0"></label>
   <label><small data-i="stock"></small><input id="ps" type="number" inputmode="decimal" min="0"></label>
   <label><small data-i="minst"></small><input id="pm" type="number" inputmode="decimal" min="0"></label><label style="grid-column:1/-1;display:flex;align-items:end;gap:8px;padding-bottom:10px"><input type="checkbox" id="pw"><span data-i="byw"></span></label>
  </div>
  <div class="row" style="margin:0"><button id="psave" class="pri" style="flex:1" data-i="save"></button><button id="pclr">✕</button><button id="lbl" data-i="labels"></button></div>
 </div>
 <div class="card" id="plist"></div>
</section>

<section id="v-debts" hidden>
 <div class="card"><div class="tr"><span data-i="owed"></span><b class="big" id="owedT"></b></div>
  <div class="f"><label class="w"><small data-i="cust"></small><input id="dn" list="dnames" autocomplete="off"><datalist id="dnames"></datalist></label>
   <label><small data-i="amt"></small><input id="da" type="number" inputmode="decimal" min="0"></label><label><small data-i="dnote"></small><input id="dnt"></label></div>
  <button id="dadd" class="pri" data-i="adddebt"></button></div>
 <div class="card" id="dl"></div>
</section>

<section id="v-cash" hidden>
 <div class="card"><b data-i="dayclose"></b>
  <div class="f" style="margin-top:8px"><label><small data-i="opencash"></small><input id="co" type="number" inputmode="decimal"></label><label><small data-i="counted"></small><input id="cc" type="number" inputmode="decimal"></label></div>
  <div id="cinfo"></div><button id="cclose" class="pri" style="margin-top:10px" data-i="closeday"></button></div>
 <div class="card"><b data-i="exp"></b>
  <div class="f" style="margin-top:8px"><label><small data-i="ecat"></small><select id="ec"><option value="rent" data-i="rent"></option><option value="elec" data-i="elec"></option><option value="wage" data-i="wage"></option><option value="other" data-i="other"></option></select></label>
   <label><small data-i="amt"></small><input id="ea" type="number" inputmode="decimal" min="0"></label><label class="w"><small data-i="dnote"></small><input id="en"></label></div>
  <button id="eadd" class="pri" data-i="addexp"></button><div id="el" style="margin-top:8px"></div></div>
 <div class="card"><b data-i="history"></b><div id="hl"></div></div>
</section>

<section id="v-sales" hidden>
 <div class="per" id="per"><button data-k="t" data-i="today"></button><button data-k="w" data-i="week"></button><button data-k="m" data-i="month"></button><button data-k="a" data-i="all"></button></div>
 <div class="stats" id="stats"></div>
 <p class="mu" id="since"></p>
 <div class="card"><b data-i="daily"></b><div id="dlist"></div></div>
 <div class="card"><b data-i="recent"></b><div id="slist"></div></div>
 <div class="card"><div class="row" style="flex-wrap:wrap"><button id="bcsv" data-i="csv"></button><button id="bbak" data-i="bak"></button><button id="bres" data-i="res"></button><button id="wipe" class="x" data-i="wipe"></button></div>
  <div class="f" style="margin:0"><label><small data-i="store"></small><input id="set-store"></label><label><small data-i="curr"></small><input id="set-cur"></label><label class="w"><small data-i="pin"></small><input id="set-pin" type="password" inputmode="numeric" maxlength="8"></label></div></div>
</section>
</main>
<div id="lblSheet"></div><div id="md" class="modal" hidden><div class="mbox" id="mb"></div></div>
<div id="toast" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L={
cw_host:['This page is inside a frame that blocks the camera. Open the downloaded file in Chrome, or use the Photo button.','ئەم لاپەڕەیە لە ناو چوارچێوەیەکدایە کە کامێرا بلۆک دەکات. فایلە داگیراوەکە لە Chrome بکەرەوە، یان دوگمەی وێنە بەکاربهێنە.'],
debts:['Debts','قەرزەکان'],cash:['Cash','قاسە'],cred:['On credit','بە قەرز'],cust:['Customer name','ناوی کڕیار'],dnote:['Note (optional)','تێبینی (ئارەزوومەندانە)'],adddebt:['Add debt','زیادکردنی قەرز'],owed:['Total owed','کۆی قەرزەکان'],rem:['Remaining','ماوە'],dpay:['Pay','پارەدان'],amt:['Amount','بڕ'],settled:['Paid','پێدراوەتەوە'],
exp:['Expenses','خەرجی'],ecat:['Category','جۆر'],rent:['Rent','کرێ'],elec:['Electricity','کارەبا'],wage:['Wages','مووچە'],other:['Other','تر'],addexp:['Add expense','زیادکردنی خەرجی'],net:['Net profit','قازانجی پاک'],
dayclose:['Daily cash closing','داخستنی ڕۆژانەی قاسە'],opencash:['Opening cash','پارەی سەرەتای قاسە'],cashsales:['Cash sales','فرۆشتنی کاش'],debtin:['Debt payments received','قەرزی وەرگیراو'],expected:['Expected in drawer','پێویستە لە قاسە هەبێت'],counted:['Counted cash','پارەی ژمێردراو'],diff:['Difference','جیاوازی'],closeday:['Close the day','داخستنی ڕۆژ'],history:['Previous closings','داخستنەکانی پێشوو'],
restock:['Restock','زیادکردنی بڕ'],qtyin:['Quantity received','بڕی گەیشتوو'],newcost:['New cost price','نرخی کڕینی نوێ'],avg:['Average with old stock cost','تێکڕای نرخ لەگەڵ کاڵای کۆن'],minst:['Warn when stock is at or below','ئاگاداری کاتێک بڕ دەگاتە'],lowwarn:['Low stock','کاڵای کەمبوو'],
pin:['PIN (locks Products, Cash and Records)','کۆدی نهێنی (کاڵاکان و قاسە و تۆمارەکان دەپارێزێت)'],enterpin:['Enter PIN','کۆدی نهێنی بنووسە'],wrongpin:['Wrong PIN','کۆدەکە هەڵەیە'],pinset:['PIN saved on this device','کۆدەکە لەسەر ئەم ئامێرە پاشەکەوت کرا'],
labels:['🏷 Labels','🏷 لەیبڵ'],printl:['Print labels','چاپکردنی لەیبڵ'],copies:['Copies per product','ژمارەی لەیبڵ بۆ هەر کاڵایەک'],go:['OK','باشە'],np2:['Please fill in the required fields','تکایە خانە پێویستەکان پڕ بکەرەوە'],
del:['Delete this sale','سڕینەوەی ئەم فرۆشتنە'],wipe:['Delete all sales','سڕینەوەی هەموو فرۆشتنەکان'],cw_http:['The camera needs a secure (HTTPS) page.','کامێرا پێویستی بە لاپەڕەی پارێزراو (HTTPS) هەیە.'],
cw_denied:['Camera is blocked for this site. In Chrome tap the lock icon, then Permissions, Camera, Allow, and reload.','کامێرا بۆ ئەم ماڵپەڕە بلۆک کراوە. لە Chrome ئایکۆنی قفڵ ← Permissions ← Camera ← Allow، پاشان دووبارە بکەرەوە.'],
cw_none:['No camera was found on this device.','هیچ کامێرایەک نەدۆزرایەوە.'],
cw_busy:['Another app is using the camera. Close it and try again.','بەرنامەیەکی تر کامێرا بەکاردێنێت. دایبخە و دووبارە هەوڵ بدەوە.'],
cw_prompt:['Camera permission was refused. Tap Scan again and choose Allow.','ڕێگەپێدانی کامێرا ڕەتکرایەوە. دووبارە سکان دابگرە و Allow هەڵبژێرە.'],
sell:['Sell','فرۆشتن'],prods:['Products','کاڵاکان'],recs:['Records','تۆمارەکان'],
search:['Scan / type barcode or product name','بارکۆد سکان بکە یان ناوی کاڵا بنووسە'],scan:['📷 Scan','📷 سکان'],
disc:['Discount','داشکاندن'],total:['Total','کۆی گشتی'],recv:['Cash received','پارەی وەرگیراو'],exact:['exact','وەک خۆی'],chg:['Change','پاشماوە'],
clear:['Clear','پاککردن'],pay:['Checkout','تەواوکردنی فرۆشتن'],empty:['Cart is empty','سەبەتەکە بەتاڵە'],
nop:['No products yet. Add them in Products, or scan a barcode.','هێشتا کاڵا نییە. لە بەشی کاڵاکان زیادی بکە یان بارکۆد سکان بکە.'],
code:['Barcode','بارکۆد'],name:['Product name','ناوی کاڵا'],cost:['Cost price (original)','نرخی کڕین (ئەسڵی)'],price:['Selling price','نرخی فرۆشتن'],
costkg:['Cost price per kg','نرخی کڕین بۆ کیلۆیەک'],pricekg:['Selling price per kg','نرخی فرۆشتن بۆ کیلۆیەک'],stock:['Stock (optional)','بڕی ماوە (ئارەزوومەندانە)'],
byw:['Sold by weight (kg)','بە کێش دەفرۆشرێت (کیلۆ)'],save:['Save product','پاشەکەوتکردنی کاڵا'],edit:['Edit','دەستکاری'],sure:['Sure?','دڵنیایت؟'],
print:['🖨 Print','🖨 چاپکردن'],done:['Done','تەواو'],today:['Today','ئەمڕۆ'],week:['7 days','٧ ڕۆژ'],month:['This month','ئەم مانگە'],all:['All time','هەموو کات'],
rev:['Sales','فرۆشتن'],cst:['Cost','تێچوو'],profit:['Profit','قازانج'],cnt:['sales','فرۆشتن'],csv:['Export CSV','هەناردەی CSV'],bak:['Backup','پاشەکەوت'],res:['Restore','گەڕاندنەوە'],
store:['Shop name','ناوی دووکان'],curr:['Currency','دراو'],since:['Records since','تۆمارکردن لە'],synced:['Synced','هاوکاتکراو'],local:['This device only','تەنیا ئەم ئامێرە'],
kg:['kg','کگ'],custom:['Other weight (kg)','کێشی تر (کگ)'],daily:['Daily summary','کورتەی ڕۆژانە'],recent:['Recent sales','فرۆشتنە دوایینەکان'],view:['View','بینین'],
np:['Name and selling price are required','ناو و نرخی فرۆشتن پێویستە'],saved:['Saved','پاشەکەوت کرا'],newc:['New barcode – add the product','بارکۆدی نوێ – کاڵاکە زیاد بکە'],
low:['Cash received is less than total','پارەی وەرگیراو کەمترە لە کۆی گشتی'],camf:['Camera unavailable: ','کامێرا بەردەست نییە: '],stop:['Stop camera','وەستاندنی کامێرا'],
left:['left','ماوە'],notr:['stock not tracked','بڕ تۆمار ناکرێت'],nocode:['no barcode','بێ بارکۆد'],paste:['Choose or paste a backup (replaces current data):','باکئەپ هەڵبژێرە یان دابنێ (داتای ئێستا دەگۆڕێت):'],
inv:['Invalid backup','باکئەپەکە هەڵەیە'],copy:['Copy','کۆپی'],close:['Close','داخستن'],cancel:['Cancel','پاشگەزبوونەوە'],thanks:['Thank you!','سوپاس!'],paid:['Paid','دراو'],margin:['margin','قازانج'],photo:['🖼 Photo','🖼 وێنە'],nobar:['No barcode found – take a closer, sharper photo','بارکۆد نەدۆزرایەوە – وێنەیەکی نزیکتر و ڕوونتر بگرە'],camdeny:['Camera blocked. Use the Photo button, or allow the camera in browser site settings.','کامێرا بلۆک کراوە. دوگمەی وێنە بەکاربهێنە یان لە ڕێکخستنەکانی وێبگەڕ ڕێگە بدە.']};
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){}};
let lang=ls('cashier-lang')||'en';const t=k=>L[k][lang==='ku'?1:0];
const blank=()=>({cur:'IQD',store:'My Shop',products:[],sales:[],since:new Date().toISOString(),debts:[],exp:[],closes:[],u:0});
let db=blank(),cart=[],sc=null,last='',lastT=0,cdb=null,cur='sell',per='t';
try{const r=ls('cashier-v1');if(r)db=Object.assign(blank(),JSON.parse(r))}catch(e){}
if(db.sales.length&&db.since>db.sales[0].t)db.since=db.sales[0].t;
const saveL=()=>ls('cashier-v1',JSON.stringify(db));
function push(){db.u=Date.now();saveL();if(cdb)cdb.doc('shop/main').set({products:db.products,store:db.store,cur:db.cur,since:db.since,del:db.del||[],debts:db.debts||[],exp:db.exp||[],closes:db.closes||[],u:db.u}).catch(()=>chip(false))}
const n2=v=>(+v||0).toLocaleString('en-US',{maximumFractionDigits:2}),money=v=>n2(v)+' '+db.cur;
const fr={.25:'¼',.5:'½',.75:'¾'},fq=(q,w)=>w?(fr[q]||n2(q))+' '+t('kg'):q;
function toast(m){const e=$('#toast');e.textContent=m;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();a.close()},90)}catch(e){}}
const modal=h=>{$('#mb').innerHTML=h;$('#md').hidden=false},closeM=()=>$('#md').hidden=true;
$('#md').onclick=e=>{if(e.target.id==='md')closeM()};
function chip(ok){$('#sync').textContent=ok?'● '+t('synced'):'○ '+t('local')}

/* language */
function applyLang(){const k=lang==='ku';document.documentElement.dir=k?'rtl':'ltr';document.documentElement.lang=k?'ckb':'en';
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
 document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=t(e.dataset.p));
 $('#lang').textContent=k?'English':'کوردی';chip(!!cdb);plab();refresh()}
$('#lang').onclick=()=>{lang=lang==='ku'?'en':'ku';ls('cashier-lang',lang);applyLang()};

/* camera */
async function startScan(cb,once){await stopScan();$('#cam').hidden=false;
 try{sc=new Html5Qrcode('reader');await sc.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:150}},txt=>{

$('#co').oninput=$('#cc').oninput=rCash;
$('#cclose').onclick=()=>{if($('#cc').value==='')return toast(t('np2'));const k=cashCalc(),op=+$('#co').value||0,exp=op+k.sc+k.di-k.ex,c=+$('#cc').value;
 (db.closes=db.closes||[]).push({id:Date.now(),t:new Date().toISOString(),expected:exp,counted:c,diff:c-exp});push();$('#co').dataset.i='';$('#co').value=$('#cc').value='';rCash();toast(t('saved'))};
$('#eadd').onclick=()=>{const a=parseFloat($('#ea').value);if(!(a>0))return toast(t('np2'));
 (db.exp=db.exp||[]).push({id:Date.now(),t:new Date().toISOString(),cat:$('#ec').value,amt:a,note:$('#en').value.trim()});push();$('#ea').value=$('#en').value='';rCash()};
$('#el').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.sure){db.exp=db.exp.filter(x=>x.id!=b.dataset.id);push();rCash()}else{b.dataset.sure=1;b.textContent=t('sure')}};

/* ---- restock ---- */
function restock(p){modal(`<h3 style="margin:0">${esc(p.name)}</h3><small>${t('stock')}: ${p.stock===''||p.stock==null?'—':n2(p.stock)} · ${t('cost')}: ${n2(p.cost)}</small><label style="display:block;margin-top:10px"><small>${t('qtyin')}${p.w?' ('+t('kg')+')':''}</small><input id="rq" type="number" inputmode="decimal" min="0"></label><label style="display:block;margin-top:8px"><small>${t('newcost')}${p.w?' / '+t('kg'):''}</small><input id="rc" type="number" inputmode="decimal" min="0" value="${p.cost||''}"></label><label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="ra" checked><span>${t('avg')}</span></label><div class="row" style="margin:12px 0 0"><button class="pri" id="rok">${t('go')}</button><button onclick="closeM()">${t('cancel')}</button></div>`);
 $('#rok').onclick=()=>{const q=parseFloat($('#rq').value),c=parseFloat($('#rc').value);if(!(q>0)||isNaN(c))return toast(t('np2'));
  const old=p.stock===''||p.stock==null?0:+p.stock;p.cost=$('#ra').checked&&old>0?+((old*(p.cost||0)+q*c)/(old+q)).toFixed(2):c;p.stock=+(old+q).toFixed(3);push();closeM();rProd();toast(t('saved'))}}

/* ---- barcode labels ---- */
function ean(){let d;do{d='2'+String(Math.floor(Math.random()*1e11)).padStart(11,'0')}while(db.products.some(p=>p.code===d));let x=0;for(let i=0;i<12;i++)x+=+d[i]*(i%2?3:1);return d+((10-x%10)%10)}
$('#lbl').onclick=()=>{if(!db.products.length)return toast(t('nop'));
 modal(`<div style="max-height:50vh;overflow:auto">${db.products.map(p=>`<label style="display:flex;gap:8px;align-items:center;padding:5px 0"><input type="checkbox" class="lk" value="${p.id}"${p.code?'':' checked'}><span>${esc(p.name)}<small>${esc(p.code)||t('nocode')}</small></span></label>`).join('')}</div><label style="display:block;margin-top:8px"><small>${t('copies')}</small><input id="lc2" type="number" value="1" min="1" max="50"></label><div class="row" style="margin:12px 0 0"><button class="pri" id="lgo">${t('printl')}</button><button onclick="closeM()">${t('cancel')}</button></div>`);
 $('#lgo').onclick=()=>{const ids=[...document.querySelectorAll('.lk:checked')].map(x=>x.value),n=Math.max(1,+$('#lc2').value||1);if(!ids.length)return;
  let h='',k=0;const codes=[];
  ids.forEach(id=>{const p=db.products.find(x=>x.id==id);if(!p)return;if(!p.code)p.code=ean();for(let i=0;i<n;i++){h+=`<div class="lb"><b>${esc(p.name)}</b><svg id="bc${k}"></svg><div>${money(p.price)}${p.w?' / '+t('kg'):''}</div></div>`;codes.push([k++,p.code])}});
  push();closeM();rProd();const sh=$('#lblSheet');sh.innerHTML=h;
  codes.forEach(([i,c])=>{const o={height:36,fontSize:11,margin:0};try{JsBarcode('#bc'+i,c,Object.assign({format:/^\d{13}$/.test(c)?'EAN13':'CODE128'},o))}catch(e){try{JsBarcode('#bc'+i,c,Object.assign({format:'CODE128'},o))}catch(_){}}});
  sh.classList.add('show');setTimeout(()=>{window.print();sh.classList.remove('show')},300)}};

/* ---- PIN ---- */
$('#set-pin').onchange=e=>{ls('cashier-pin',e.target.value.trim());toast(t('pinset'))};

$('#set-store').onchange=e=>{db.store=e.target.value.trim()||'My Shop';push();refresh()};
$('#set-cur').onchange=e=>{db.cur=e.target.value.trim()||'IQD';push();refresh()};

/* sync across devices (needs the signed-in Claude page; otherwise stays local) */
async function initSync(){try{if(!window.claude)return;cdb=await claude.use('db');if(!cdb)return;let first=true;
 cdb.doc('shop/main').onSnapshot(s=>{const d=s.exists?s.data():null;
  if(!d){if(db.products.length||db.sales.length)push()}
  else if((d.u||0)>(db.u||0)){db.products=d.products||[];db.store=d.store||db.store;db.cur=d.cur||db.cur;db.since=d.since||db.since;if(d.debts)db.debts=d.debts;if(d.exp)db.exp=d.exp;if(d.closes)db.closes=d.closes;db.del=[...new Set([...(db.del||[]),...(d.del||[])])];db.sales=db.sales.filter(x=>!db.del.includes(x.id));db.u=d.u;saveL();refresh()}
  else if(first&&(d.u||0)<(db.u||0))push();
  first=false;chip(true)},()=>chip(false));
 cdb.collection('sales').onSnapshot(s=>{const have=new Set(db.sales.map(x=>x.id)),rem=new Set();let ch=false;
  s.docs.forEach(x=>{const v=x.data();rem.add(v.id);if(!have.has(v.id)&&!(db.del||[]).includes(v.id)){db.sales.push(v);ch=true}});
  db.sales.forEach(x=>{if(!rem.has(x.id))cdb.collection('sales').doc(String(x.id)).set(x).catch(()=>{})});
  if(ch){db.sales.sort((a,b)=>a.id-b.id);saveL();refresh()}},()=>{});
}catch(e){}}
applyLang();initSync();
</script></body></html>
