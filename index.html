<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cashier</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f766e"><link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--ac:#0f766e;--on:#fff;--bd:#e1e5ea;--rd:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101317;--card:#1a1f26;--tx:#eceff3;--mu:#9aa3af;--ac:#2dd4bf;--on:#06201c;--bd:#2b323c;--rd:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101317;--card:#1a1f26;--tx:#eceff3;--mu:#9aa3af;--ac:#2dd4bf;--on:#06201c;--bd:#2b323c;--rd:#f87171;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Naskh Arabic",Tahoma,sans-serif}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
header b{flex:1;font-size:17px}nav{display:flex;gap:6px}
.chip{font-size:12px;color:var(--mu)}
button,input{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 13px;cursor:pointer}
button.on,button.pri{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
input{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input[type=checkbox]{width:auto}input[type=number],#pc{direction:ltr}
main{max-width:1100px;margin:0 auto;padding:12px}
.grid{display:grid;gap:12px}@media(min-width:800px){.grid{grid-template-columns:1.2fr 1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}.grid .card{margin:0}
.row{display:flex;gap:8px;margin-bottom:10px}
.mu,small{color:var(--mu)}small{display:block;font-size:12.5px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pb{text-align:start;display:flex;flex-direction:column;gap:2px;min-height:62px}
.ln{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.qt{display:flex;align-items:center;gap:6px}.qt button{padding:4px 11px}
.lt{font-weight:600;text-align:end}.x{color:var(--rd)}
.tr{display:flex;justify-content:space-between;align-items:center;margin:8px 0;gap:8px}
.big{font-size:26px;font-weight:700}
#reader{width:100%;max-width:420px;margin:0 auto 8px;border-radius:12px;overflow:hidden}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.f .w{grid-column:1/-1}.f label>small{margin-bottom:3px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}.tile b{font-size:18px}
.per{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.wg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.wg button{padding:14px 4px;font-size:17px}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
[hidden]{display:none!important}
.mbox{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:380px;max-height:90%;overflow:auto}
.r{display:flex;justify-content:space-between;gap:10px;margin:3px 0}
textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px;font:12px monospace;direction:ltr}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;z-index:30}
@media print{body *{visibility:hidden}#rcp,#rcp *{visibility:visible}#rcp{position:absolute;left:0;top:0;width:100%;color:#000}}
nav{width:100%;overflow-x:auto}nav button{white-space:nowrap}
select{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;width:100%;font:inherit}
#lowbar{background:#f59e0b22;border:1px solid #f59e0b;border-radius:10px;padding:8px 10px;margin-bottom:10px;font-size:13.5px}
#lblSheet{display:none}.lb{border:1px dashed #999;padding:4px;text-align:center;font-size:11px;break-inside:avoid}.lb svg{max-width:100%}
@media print{#lblSheet.show{display:grid;grid-template-columns:repeat(3,1fr);gap:6mm;position:absolute;left:0;top:0;width:100%;background:#fff;color:#000}#lblSheet.show,#lblSheet.show *{visibility:visible}}
#pcard{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ac);color:var(--on);padding:14px 22px;border-radius:16px;z-index:25;text-align:center;font-size:18px;min-width:240px;box-shadow:0 6px 24px #0006}
#v-sell{display:grid;gap:12px;grid-template-areas:"a" "c" "b"}#sA{grid-area:a}#cartCard{grid-area:c;margin:0}#sB{grid-area:b}
@media(min-width:800px){#v-sell{grid-template-columns:1.2fr 1fr;grid-template-areas:"a c" "b c";align-items:start}}
#lines{max-height:34vh;overflow:auto}
.pl{border:0;background:none;padding:2px 0;color:var(--ac);text-decoration:underline;font-size:12.5px}
</style></head><body>
<header><b id="sn">Cashier</b><span class="chip" id="sync"></span><button id="inst" hidden data-i="inst"></button><button id="linkBtn">🔗</button><button id="lang">کوردی</button>
<nav><button data-v="sell" data-i="sell" class="on"></button><button data-v="prod" data-i="prods"></button><button data-v="rc" data-i="rc"></button><button data-v="debts" data-i="debts"></button><button data-v="cash" data-i="cash"></button><button data-v="sales" data-i="recs"></button></nav></header>
<main>
<section id="v-sell">
 <div id="sA">
  <div class="row"><input id="q" data-p="search" autocomplete="off"><button id="scanBtn" class="pri" data-i="scan"></button><button id="photoBtn" data-i="photo"></button><input type="file" id="pf" accept="image/*" capture="environment" hidden></div>
  <div class="row" style="flex-wrap:wrap"><button id="nfcBtn" data-i="nfcb"></button><button id="itm" data-i="item"></button></div>
  <div id="cam" class="card" hidden style="margin-bottom:0"><div id="reader"></div><button id="camStop" data-i="stop"></button></div>
 </div>
 <div class="card" id="cartCard">
  <div class="tr" style="margin-top:0"><b><span data-i="cartt"></span> (<span id="ccount">0</span>)</b></div>
  <div id="lines"></div>
  <div class="tr"><span data-i="disc"></span><input id="disc" type="number" inputmode="decimal" min="0" style="max-width:140px" placeholder="0"></div>
  <div class="tr"><span data-i="total"></span><span class="big" id="tot">0</span></div>
  <div class="tr"><span data-i="recv"></span><input id="paid" type="number" inputmode="decimal" min="0" style="max-width:140px" data-p="exact"></div>
  <div class="tr"><span data-i="chg"></span><b id="chg">—</b></div>
  <div class="row" style="margin:10px 0 0"><button id="clr" data-i="clear"></button><button id="cred" data-i="cred"></button><button id="pay" class="pri" style="flex:1;padding:13px" data-i="pay"></button></div>
 </div>
 <div id="sB"><div id="chips" class="per"></div><div id="lowbar" hidden></div><div id="list" class="plist"></div></div>
</section>

<section id="v-prod" hidden>
 <div class="card">
  <input id="pid" type="hidden">
  <div class="f">
   <label class="w"><small data-i="code"></small><div class="row" style="margin:0"><input id="pc"><button id="pscan">📷</button><button id="pphoto">🖼</button><button id="pnfc">📡</button></div></label>
   <label class="w"><small data-i="name"></small><input id="pn"></label>
   <label><small id="lc"></small><input id="pk" type="number" inputmode="decimal" min="0"></label>
   <label><small id="lp"></small><input id="pp" type="number" inputmode="decimal" min="0"></label>
   <label><small data-i="stock"></small><input id="ps" type="number" inputmode="decimal" min="0"></label>
   <label><small data-i="minst"></small><input id="pm" type="number" inputmode="decimal" min="0"></label><label><small data-i="cnl"></small><input id="pcn" type="number" inputmode="numeric" min="1"></label><label><small data-i="pkl"></small><input id="ppk" type="number" inputmode="numeric" min="1"></label><label><small data-i="cat"></small><select id="pcat"></select></label><label style="grid-column:1/-1;display:flex;align-items:end;gap:8px;padding-bottom:10px"><input type="checkbox" id="pw"><span data-i="byw"></span></label>
  </div>
  <div class="row" style="margin:0"><button id="psave" class="pri" style="flex:1" data-i="save"></button><button id="pclr">✕</button><button id="lbl" data-i="labels"></button><button id="acat" data-i="addcat"></button><button id="pnfcw" data-i="nfcwb"></button></div>
 </div>
 <input id="psr" data-p="psearch" style="margin-bottom:10px"><div class="card" id="plist"></div>
</section>

<section id="v-debts" hidden>
 <div class="card"><div class="tr"><span data-i="owed"></span><b class="big" id="owedT"></b></div>
  <div class="f"><label class="w"><small data-i="cust"></small><input id="dn" list="dnames" autocomplete="off"><datalist id="dnames"></datalist></label>
   <label><small data-i="amt"></small><input id="da" type="number" inputmode="decimal" min="0"></label><label><small data-i="dnote"></small><input id="dnt"></label></div>
  <button id="dadd" class="pri" data-i="adddebt"></button><button id="dprod" data-i="dprod"></button></div>
 <div class="card" id="dl"></div>
</section>

<section id="v-cash" hidden>
 <div class="card"><b data-i="dayclose"></b>
  <div class="f" style="margin-top:8px"><label><small data-i="opencash"></small><input id="co" type="number" inputmode="decimal"></label><label><small data-i="counted"></small><input id="cc" type="number" inputmode="decimal"></label></div>
  <div id="cinfo"></div><button id="cclose" class="pri" style="margin-top:10px" data-i="closeday"></button></div>
 <div class="card"><b data-i="exp"></b>
  <div class="f" style="margin-top:8px"><label><small data-i="ecat"></small><select id="ec"><option value="rent" data-i="rent"></option><option value="elec" data-i="elec"></option><option value="wage" data-i="wage"></option><option value="gen" data-i="gen"></option><option value="wtr" data-i="wtr"></option><option value="inet" data-i="inet"></option><option value="other" data-i="other"></option></select></label>
   <label><small data-i="amt"></small><input id="ea" type="number" inputmode="decimal" min="0"></label><label><small data-i="pdate"></small><input id="ed" type="date"></label><label><small data-i="dnote"></small><input id="en"></label></div>
  <button id="eadd" class="pri" data-i="addexp"></button><div id="el" style="margin-top:8px"></div></div>
 <div class="card"><b data-i="history"></b><div id="hl"></div></div>
</section>

<section id="v-rc" hidden>
 <div class="card"><div class="tr" style="margin:0"><span><span data-i="cartt"></span> (<b id="rcc">0</b>)</span><button class="pri" id="rcgo" data-i="gosell"></button></div></div>
 <div id="rcprov"></div>
 <div class="card"><b data-i="addprov"></b>
  <div class="f" style="margin-top:8px"><label><small data-i="provn"></small><input id="rpn"></label><label><small data-i="plat"></small><select id="rpp"></select></label><label class="w"><small data-i="buyp"></small><input id="rpb" type="number" inputmode="decimal" value="100"></label></div>
  <div class="row" style="margin:0"><button class="pri" id="rpadd" data-i="go"></button><button id="rplat" data-i="addplat"></button></div></div>
 <div id="rcul" class="card" hidden><button id="rcunl" data-i="unlock"></button></div>
 <div id="rcpriv">
  <div class="card"><b data-i="rbuy"></b>
   <div class="f" style="margin-top:8px"><label><small data-i="plat"></small><select id="rbp"></select></label><label><small data-i="pdate"></small><input id="rbd" type="date"></label><label><small data-i="paidamt"></small><input id="rba" type="number" inputmode="decimal" min="0"></label><label><small data-i="recvd"></small><input id="rbf" type="number" inputmode="decimal" min="0"></label></div>
   <button class="pri" id="rbadd" data-i="go"></button><div id="rbl" style="margin-top:8px"></div></div>
  <div class="card"><b data-i="rrep"></b>
   <div class="per" id="rrper" style="margin:8px 0"><button data-k="m" data-i="month"></button><button data-k="p" data-i="pmonth"></button></div><div id="rrl"></div></div>
 </div>
</section>

<section id="v-sales" hidden>
 <div class="per" id="per"><button data-k="t" data-i="today"></button><button data-k="w" data-i="week"></button><button data-k="m" data-i="month"></button><button data-k="p" data-i="pmonth"></button><button data-k="a" data-i="all"></button></div>
 <div class="stats" id="stats"></div>
 <p class="mu" id="since"></p>
 <div class="card"><b data-i="daily"></b><div class="per" id="gb" style="margin:8px 0"><button data-k="d" data-i="gday"></button><button data-k="w" data-i="gweek"></button><button data-k="m" data-i="gmonth"></button></div><div id="dlist"></div></div>
 <div class="card"><b data-i="top"></b><div id="toplist"></div></div>
 <div class="card"><b data-i="recent"></b><div id="slist"></div></div>
 <div class="card"><b data-i="bkt"></b><p class="mu" id="bkst"></p><div class="row" style="flex-wrap:wrap;margin:0"><button id="bkn" data-i="bkn"></button><button id="bks" data-i="bks"></button><button id="bkf" data-i="bkf"></button><button id="bkr" data-i="bkr"></button></div></div>
<div class="card"><div class="row" style="flex-wrap:wrap"><button id="bcsv" data-i="csv"></button><button id="bbak" data-i="bak"></button><button id="bres" data-i="res"></button><button id="wipe" class="x" data-i="wipe"></button></div>
  <div class="f" style="margin:0"><label><small data-i="store"></small><input id="set-store"></label><label><small data-i="curr"></small><input id="set-cur"></label><label class="w"><small data-i="pin"></small><input id="set-pin" type="password" inputmode="numeric" maxlength="8"></label></div></div>
</section>
</main>
<div id="pcard" hidden></div><div id="lblSheet"></div><div id="md" class="modal" hidden><div class="mbox" id="mb"></div></div>
<div id="toast" hidden></div>

async function lookup(code){try{const c=new AbortController();setTimeout(()=>c.abort(),5000);
 const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields=product_name,brands,quantity',{signal:c.signal});const j=await r.json();
 if(j.status!==1||!j.product)return null;const q=j.product;return [q.brands&&q.brands.split(',')[0],q.product_name,q.quantity].filter(Boolean).join(' ')||null}catch(e){return null}}
function fillCode(c){$('#pc').value=c;$('#pn').focus();if(!$('#pn').value)lookup(c).then(n=>{if(n&&!$('#pn').value){$('#pn').value=n;toast(t('found'))}})}
function gotCode(code){if(ls('cashier-fwd')==='1'&&conn&&conn.open){peerSend({k:'scan',code});toast(code);return}
 const p=db.products.find(x=>x.code===code);if(p)pick(p);else unknown(code)}
async function nfcScan(cb,once){if(!('NDEFReader' in window))return toast(t('nonfc'));
 try{if(nfcAbort)nfcAbort.abort();nfcAbort=new AbortController();const r=new NDEFReader();await r.scan({signal:nfcAbort.signal});toast(t('nfcon'));
  r.onreading=e=>{let code=e.serialNumber||'';for(const rec of e.message.records){if(rec.recordType==='text'){try{code=new TextDecoder(rec.encoding||'utf-8').decode(rec.data);break}catch(_){}}}
   if(!code)return;const n=Date.now();if(code===last&&n-lastT<1500)return;last=code;lastT=n;beep();cb(code);if(once)nfcAbort.abort()}}catch(e){toast(t('nfcfail'))}}
$('#nfcBtn').onclick=()=>nfcScan(gotCode);
$('#pnfc').onclick=()=>nfcScan(c=>{$('#pc').value=c;$('#pn').focus()},true);
$('#itm').onclick=()=>{modal(`<h3 style="margin:0">${t('itemt')}</h3><label style="display:block;margin-top:8px"><small>${t('iname')}</small><input id="in1"></label><div class="f" style="margin-top:8px"><label><small>${t('price')}</small><input id="in2" type="number" inputmode="decimal" min="0"></label><label><small>${t('qty')}</small><input id="in3" type="number" inputmode="decimal" min="0" value="1"></label><label class="w"><small>${t('cost')}</small><input id="in4" type="number" inputmode="decimal" min="0"></label></div><div class="row" style="margin:12px 0 0"><button class="pri" id="inok">${t('go')}</button><button onclick="closeM()">${t('cancel')}</button></div>`);
 $('#inok').onclick=()=>{const pr=parseFloat($('#in2').value),q=parseFloat($('#in3').value)||1;if(isNaN(pr)||pr<0)return toast(t('np2'));
  cart.push({id:'x'+Date.now(),n:$('#in1').value.trim()||t('item1'),p:pr,o:pr,c:parseFloat($('#in4').value)||0,w:false,q});closeM();rCart()}};

/* ---- link devices (live sync + remote scanner) ---- */
function lg(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function startPeer(){if(!pairCode||typeof Peer==='undefined'||peer)return;
 try{peer=new Peer('shop-'+pairCode+'-'+role);
  peer.on('open',()=>{if(role===2)dial()});
  peer.on('connection',c=>setConn(c));
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(_){}});
  peer.on('error',e=>{if(e.type==='peer-unavailable')return;try{peer.destroy()}catch(_){}peer=null;setTimeout(startPeer,9000)})}catch(e){peer=null}}
function dial(){if(!peer||!peer.open||(conn&&conn.open))return;setConn(peer.connect('shop-'+pairCode+'-1',{reliable:true}))}
function setConn(c){conn=c;c.on('open',()=>{chip();peerSend({k:'full',db:lite(),sales:db.sales})});c.on('data',onPeer);c.on('close',()=>chip());c.on('error',()=>{})}
setInterval(()=>{if(role===2&&pairCode)dial()},7000);
function stopPeer(){try{if(conn)conn.close();if(peer)peer.destroy()}catch(e){}conn=peer=null;chip()}
function addSale(x){if((db.del||[]).includes(x.id)||db.sales.some(y=>y.id===x.id))return;db.sales.push(x);db.sales.sort((a,b)=>a.id-b.id);saveL();refresh()}
function onPeer(m){try{
 if(m.k==='scan')return onRemoteScan(m.code);
 if(m.k==='sale')return addSale(m.s);
 const d=m.db;if(!d)return;if(m.sales)m.sales.forEach(addSale);
 if((d.u||0)>(db.u||0)){db.products=d.products||[];db.store=d.store||db.store;db.cur=d.cur||db.cur;db.since=d.since||db.since;if(d.debts)db.debts=d.debts;if(d.exp)db.exp=d.exp;if(d.closes)db.closes=d.closes;if(d.cats)db.cats=d.cats;if(d.rc)db.rc=d.rc;db.u=d.u}
 db.del=[...new Set([...(db.del||[]),...(d.del||[])])];db.sales=db.sales.filter(x=>!db.del.includes(x.id));saveL();refresh();
 if(m.k==='full'&&(db.u||0)>(d.u||0))peerSend({k:'meta',db:lite()})}catch(e){}}
function onRemoteScan(code){const p=db.products.find(x=>x.code===code),e=$('#pcard');beep();
 e.innerHTML=p?`<div>${esc(p.name)}</div><div class="big">${unitTxt(p)}</div><small style="color:inherit">${stTxt(p).slice(3)}</small>`:`<b>${esc(code)}</b><div>${t('unk')}</div>`;
 e.hidden=false;clearTimeout(onRemoteScan.t);onRemoteScan.t=setTimeout(()=>e.hidden=true,8000);
 if(p&&ls('cashier-radd')!=='0'&&cur==='sell')pick(p)}
function linkUI(){const on=conn&&conn.open;
 modal(`<h3 style="margin:0">${t('linkt')}</h3>${typeof Peer==='undefined'?`<p class="mu">${t('linkna')}</p>`:''}<p>${on?'● '+t('linked'):pairCode?'○ '+t('waitp'):''}</p>
 ${pairCode?`<div class="big" style="direction:ltr;text-align:center;letter-spacing:4px">${pairCode}</div><label style="display:flex;gap:8px;align-items:center;margin:10px 0"><input type="checkbox" id="lf"${ls('cashier-fwd')==='1'?' checked':''}><span>${t('fwd')}</span></label><label style="display:flex;gap:8px;align-items:center;margin:10px 0"><input type="checkbox" id="la"${ls('cashier-radd')!=='0'?' checked':''}><span>${t('radd')}</span></label><button class="x" id="lun">${t('unlink')}</button>`
 :`<button class="pri" id="lmk" style="width:100%;margin:8px 0">${t('mk')}</button><input id="ljc" placeholder="ABC123" style="direction:ltr;text-transform:uppercase" maxlength="8"><button id="ljn" style="width:100%;margin-top:8px">${t('jn')}</button>`}
 <div class="row" style="margin:12px 0 0"><button onclick="closeM()">${t('close')}</button></div>`);
 if(pairCode){$('#lf').onchange=e=>ls('cashier-fwd',e.target.checked?'1':'0');$('#la').onchange=e=>ls('cashier-radd',e.target.checked?'1':'0');$('#lun').onclick=()=>{stopPeer();pairCode='';ls('cashier-pair','');linkUI()}}
 else{$('#lmk').onclick=()=>{pairCode=lg();role=1;ls('cashier-pair',pairCode);ls('cashier-role','1');startPeer();linkUI()};
  $('#ljn').onclick=()=>{const c=$('#ljc').value.trim().toUpperCase();if(c.length<4)return;pairCode=c;role=2;ls('cashier-pair',c);ls('cashier-role','2');startPeer();linkUI()}}}

/* ---- automatic backups ---- */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('cashier-bk',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbGet=async k=>{const d=await idb();return new Promise(r=>{const q=d.transaction('k').objectStore('k').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})};
const idbSet=async(k,v)=>{const d=await idb();return new Promise(r=>{const x=d.transaction('k','readwrite');x.objectStore('k').put(v,k);x.oncomplete=()=>r()})};
async function snap(force){try{const sn=(await idbGet('snaps'))||[],j=JSON.stringify(db),l=sn[sn.length-1];
 if(!force&&l&&l.u===db.u&&l.n===db.sales.length)return;
 sn.push({t:Date.now(),u:db.u,n:db.sales.length,data:j});while(sn.length>30)sn.shift();await idbSet('snaps',sn);bkLast=Date.now();
 if(bkFolder){try{if(await bkFolder.queryPermission({mode:'readwrite'})==='granted'){for(const n of ['cashier-latest.json','cashier-'+day()+'.json']){const f=await bkFolder.getFileHandle(n,{create:true}),w=await f.createWritable();await w.write(j);await w.close()}}}catch(e){}}
 bkStat()}catch(e){}}
function bkStat(){const e=$('#bkst');if(e)e.textContent=(bkLast?t('bklast')+': '+new Date(bkLast).toLocaleTimeString():'')+(bkFolder?' · '+t('bkfold'):'')}
async function sendBackup(){const j=JSON.stringify(db),f=new File([j],'cashier-backup-'+day()+'.json',{type:'application/json'});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Cashier backup'});return}}catch(e){if(e&&e.name==='AbortError')return}
 saveFile(f.name,j)}
$('#bkn').onclick=async()=>{await snap(true);toast(t('saved'))};
$('#bks').onclick=sendBackup;
$('#bkf').onclick=async()=>{if(!window.showDirectoryPicker)return toast(t('bkna'));
 try{if(bkFolder&&await bkFolder.queryPermission({mode:'readwrite'})!=='granted'&&await bkFolder.requestPermission({mode:'readwrite'})==='granted'){snap(true);return}
  bkFolder=await showDirectoryPicker({mode:'readwrite'});await idbSet('dir',bkFolder);snap(true)}catch(e){}};
$('#bkr').onclick=async()=>{const sn=(await idbGet('snaps'))||[];
 modal(`<div style="max-height:55vh;overflow:auto">${sn.slice().reverse().map((x,i)=>`<div class="ln" style="grid-template-columns:1fr auto"><div>${new Date(x.t).toLocaleString()}<small>${x.n} ${t('cnt')}</small></div><button data-n="${sn.length-1-i}">${t('res')}</button></div>`).join('')||'<p class="mu">—</p>'}</div><button onclick="closeM()" style="margin-top:10px">${t('close')}</button>`);
 $('#mb').onclick=e=>{const b=e.target.closest('button[data-n]');if(!b)return;try{db=Object.assign(blank(),JSON.parse(sn[+b.dataset.n].data));push();closeM();refresh();toast(t('saved'))}catch(_){toast(t('inv'))}}};
try{idbGet('dir').then(h=>{bkFolder=h||null}).catch(()=>{});setInterval(()=>snap(false),300000);setTimeout(()=>snap(false),4000);
 document.addEventListener('visibilitychange',()=>{if(document.hidden)snap(false)})}catch(e){}

   else if(b.id==='pdel'){if(b.dataset.sure){Z.provs=Z.provs.filter(x=>x!==v);push();closeM();rRc()}else{b.dataset.sure=1;b.textContent=t('sure')}}}};draw()}

 if(k==='c')return rcAdd(Z.cards.find(c=>c.id==b.dataset.id));
 const v=Z.provs.find(x=>x.id==b.dataset.id);if(!v)return;
 if(k==='o')return rcCustom(v);
 if(k==='m'){if(priv())rcManage(v);else askPin(()=>{unl=true;rcManage(v)})}};
$('#rcgo').onclick=()=>view('sell');
$('#rcunl').onclick=()=>askPin(()=>{unl=true;rRc()});
$('#rpadd').onclick=()=>{const n=$('#rpn').value.trim(),b=parseFloat($('#rpb').value);if(!n||isNaN(b))return toast(t('np2'));
 if(!priv())return askPin(()=>{unl=true;$('#rpadd').click()});
 rcd().provs.push({id:Date.now(),name:n,plat:$('#rpp').value,buy:b});push();$('#rpn').value='';rRc()};
$('#rplat').onclick=()=>{modal(`<p>${t('platn')}</p><input id="pln"><div class="row" style="margin:12px 0 0"><button class="pri" id="plok">${t('go')}</button><button onclick="closeM()">${t('cancel')}</button></div>`);
 $('#plok').onclick=()=>{const n=$('#pln').value.trim();if(!n)return;const Z=rcd();if(!Z.plats.includes(n))Z.plats.push(n);push();closeM();rRc()}};
$('#rbadd').onclick=()=>{const paid=parseFloat($('#rba').value),fv=parseFloat($('#rbf').value)||0,d=$('#rbd').value||new Date().toLocaleDateString('en-CA');if(!(paid>0))return toast(t('np2'));
 rcd().buys.push({id:Date.now(),t:new Date(d+'T12:00:00').toISOString(),plat:$('#rbp').value,paid,face:fv});push();$('#rba').value=$('#rbf').value='';rRc()};
$('#rbl').onclick=e=>{const b=e.target.closest('button[data-bd]');if(!b)return;if(b.dataset.sure){const Z=rcd();Z.buys=Z.buys.filter(x=>x.id!=b.dataset.bd);push();rRc()}else{b.dataset.sure=1;b.textContent=t('sure')}};
$('#rrper').onclick=e=>{const b=e.target.closest('button');if(b){rcPer=b.dataset.k;rRc()}};

$('#set-store').onchange=e=>{db.store=e.target.value.trim()||'My Shop';push();refresh()};
$('#set-cur').onchange=e=>{db.cur=e.target.value.trim()||'IQD';push();refresh()};

/* sync across devices (needs the signed-in Claude page; otherwise stays local) */
async function initSync(){try{if(!window.claude)return;cdb=await claude.use('db');if(!cdb)return;let first=true;
 cdb.doc('shop/main').onSnapshot(s=>{const d=s.exists?s.data():null;
  if(!d){if(db.products.length||db.sales.length)push()}
  else if((d.u||0)>(db.u||0)){db.products=d.products||[];db.store=d.store||db.store;db.cur=d.cur||db.cur;db.since=d.since||db.since;if(d.debts)db.debts=d.debts;if(d.exp)db.exp=d.exp;if(d.closes)db.closes=d.closes;if(d.cats)db.cats=d.cats;if(d.rc)db.rc=d.rc;db.del=[...new Set([...(db.del||[]),...(d.del||[])])];db.sales=db.sales.filter(x=>!db.del.includes(x.id));db.u=d.u;saveL();refresh()}
  else if(first&&(d.u||0)<(db.u||0))push();
  first=false;chip(true)},()=>chip(false));
 cdb.collection('sales').onSnapshot(s=>{const have=new Set(db.sales.map(x=>x.id)),rem=new Set();let ch=false;
  s.docs.forEach(x=>{const v=x.data();rem.add(v.id);if(!have.has(v.id)&&!(db.del||[]).includes(v.id)){db.sales.push(v);ch=true}});
  db.sales.forEach(x=>{if(!rem.has(x.id))cdb.collection('sales').doc(String(x.id)).set(x).catch(()=>{})});
  if(ch){db.sales.sort((a,b)=>a.id-b.id);saveL();refresh()}},()=>{});
}catch(e){}}
applyLang();initSync();
</script></body></html>
