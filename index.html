<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cashier</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--ac:#0f766e;--on:#fff;--bd:#e1e5ea;--rd:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101317;--card:#1a1f26;--tx:#eceff3;--mu:#9aa3af;--ac:#2dd4bf;--on:#06201c;--bd:#2b323c;--rd:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101317;--card:#1a1f26;--tx:#eceff3;--mu:#9aa3af;--ac:#2dd4bf;--on:#06201c;--bd:#2b323c;--rd:#f87171;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Naskh Arabic",Tahoma,sans-serif}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
header b{flex:1;font-size:17px}nav{display:flex;gap:6px}
.chip{font-size:12px;color:var(--mu)}
button,input{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 13px;cursor:pointer}
button.on,button.pri{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
input{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input[type=checkbox]{width:auto}input[type=number],#pc{direction:ltr}
main{max-width:1100px;margin:0 auto;padding:12px}
.grid{display:grid;gap:12px}@media(min-width:800px){.grid{grid-template-columns:1.2fr 1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}.grid .card{margin:0}
.row{display:flex;gap:8px;margin-bottom:10px}
.mu,small{color:var(--mu)}small{display:block;font-size:12.5px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pb{text-align:start;display:flex;flex-direction:column;gap:2px;min-height:62px}
.ln{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.qt{display:flex;align-items:center;gap:6px}.qt button{padding:4px 11px}
.lt{font-weight:600;text-align:end}.x{color:var(--rd)}
.tr{display:flex;justify-content:space-between;align-items:center;margin:8px 0;gap:8px}
.big{font-size:26px;font-weight:700}
#reader{width:100%;max-width:420px;margin:0 auto 8px;border-radius:12px;overflow:hidden}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.f .w{grid-column:1/-1}.f label>small{margin-bottom:3px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}.tile b{font-size:18px}
.per{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.wg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.wg button{padding:14px 4px;font-size:17px}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
[hidden]{display:none!important}
.mbox{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:380px;max-height:90%;overflow:auto}
.r{display:flex;justify-content:space-between;gap:10px;margin:3px 0}
textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px;font:12px monospace;direction:ltr}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;z-index:30}
@media print{body *{visibility:hidden}#rcp,#rcp *{visibility:visible}#rcp{position:absolute;left:0;top:0;width:100%;color:#000}}
</style></head><body>
<header><b id="sn">Cashier</b><span class="chip" id="sync"></span><button id="lang">کوردی</button>
<nav><button data-v="sell" data-i="sell" class="on"></button><button data-v="prod" data-i="prods"></button><button data-v="sales" data-i="recs"></button></nav></header>
<main>
<div id="cam" class="card" hidden><div id="reader"></div><button id="camStop" data-i="stop"></button></div>

<section id="v-sell" class="grid">
 <div>
  <div class="row"><input id="q" data-p="search" autocomplete="off"><button id="scanBtn" class="pri" data-i="scan"></button><button id="photoBtn" data-i="photo"></button><input type="file" id="pf" accept="image/*" capture="environment" hidden></div>
  <div id="list" class="plist"></div>
 </div>
 <div class="card">
  <div id="lines"></div>
  <div class="tr"><span data-i="disc"></span><input id="disc" type="number" inputmode="decimal" min="0" style="max-width:140px" placeholder="0"></div>
  <div class="tr"><span data-i="total"></span><span class="big" id="tot">0</span></div>
  <div class="tr"><span data-i="recv"></span><input id="paid" type="number" inputmode="decimal" min="0" style="max-width:140px" data-p="exact"></div>
  <div class="tr"><span data-i="chg"></span><b id="chg">—</b></div>
  <div class="row" style="margin:10px 0 0"><button id="clr" data-i="clear"></button><button id="pay" class="pri" style="flex:1;padding:13px" data-i="pay"></button></div>
 </div>
</section>

<section id="v-prod" hidden>
 <div class="card">
  <input id="pid" type="hidden">
  <div class="f">
   <label class="w"><small data-i="code"></small><div class="row" style="margin:0"><input id="pc"><button id="pscan">📷</button><button id="pphoto">🖼</button></div></label>
   <label class="w"><small data-i="name"></small><input id="pn"></label>
   <label><small id="lc"></small><input id="pk" type="number" inputmode="decimal" min="0"></label>
   <label><small id="lp"></small><input id="pp" type="number" inputmode="decimal" min="0"></label>
   <label><small data-i="stock"></small><input id="ps" type="number" inputmode="decimal" min="0"></label>
   <label style="display:flex;align-items:end;gap:8px;padding-bottom:10px"><input type="checkbox" id="pw"><span data-i="byw"></span></label>
  </div>
  <div class="row" style="margin:0"><button id="psave" class="pri" style="flex:1" data-i="save"></button><button id="pclr">✕</button></div>
 </div>
 <div class="card" id="plist"></div>
</section>

<section id="v-sales" hidden>
 <div class="per" id="per"><button data-k="t" data-i="today"></button><button data-k="w" data-i="week"></button><button data-k="m" data-i="month"></button><button data-k="a" data-i="all"></button></div>
 <div class="stats" id="stats"></div>
 <p class="mu" id="since"></p>
 <div class="card"><b data-i="daily"></b><div id="dlist"></div></div>
 <div class="card"><b data-i="recent"></b><div id="slist"></div></div>
 <div class="card"><div class="row" style="flex-wrap:wrap"><button id="bcsv" data-i="csv"></button><button id="bbak" data-i="bak"></button><button id="bres" data-i="res"></button><button id="wipe" class="x" data-i="wipe"></button></div>
  <div class="f" style="margin:0"><label><small data-i="store"></small><input id="set-store"></label><label><small data-i="curr"></small><input id="set-cur"></label></div></div>
</section>
</main>
<div id="md" class="modal" hidden><div class="mbox" id="mb"></div></div>
<div id="toast" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L={
cw_host:['This page is inside a frame that blocks the camera. Open the downloaded file in Chrome, or use the Photo button.','ئەم لاپەڕەیە لە ناو چوارچێوەیەکدایە کە کامێرا بلۆک دەکات. فایلە داگیراوەکە لە Chrome بکەرەوە، یان دوگمەی وێنە بەکاربهێنە.'],
del:['Delete this sale','سڕینەوەی ئەم فرۆشتنە'],wipe:['Delete all sales','سڕینەوەی هەموو فرۆشتنەکان'],cw_http:['The camera needs a secure (HTTPS) page.','کامێرا پێویستی بە لاپەڕەی پارێزراو (HTTPS) هەیە.'],
cw_denied:['Camera is blocked for this site. In Chrome tap the lock icon, then Permissions, Camera, Allow, and reload.','کامێرا بۆ ئەم ماڵپەڕە بلۆک کراوە. لە Chrome ئایکۆنی قفڵ ← Permissions ← Camera ← Allow، پاشان دووبارە بکەرەوە.'],
cw_none:['No camera was found on this device.','هیچ کامێرایەک نەدۆزرایەوە.'],
cw_busy:['Another app is using the camera. Close it and try again.','بەرنامەیەکی تر کامێرا بەکاردێنێت. دایبخە و دووبارە هەوڵ بدەوە.'],
cw_prompt:['Camera permission was refused. Tap Scan again and choose Allow.','ڕێگەپێدانی کامێرا ڕەتکرایەوە. دووبارە سکان دابگرە و Allow هەڵبژێرە.'],
sell:['Sell','فرۆشتن'],prods:['Products','کاڵاکان'],recs:['Records','تۆمارەکان'],
search:['Scan / type barcode or product name','بارکۆد سکان بکە یان ناوی کاڵا بنووسە'],scan:['📷 Scan','📷 سکان'],
disc:['Discount','داشکاندن'],total:['Total','کۆی گشتی'],recv:['Cash received','پارەی وەرگیراو'],exact:['exact','وەک خۆی'],chg:['Change','پاشماوە'],
clear:['Clear','پاککردن'],pay:['Checkout','تەواوکردنی فرۆشتن'],empty:['Cart is empty','سەبەتەکە بەتاڵە'],
nop:['No products yet. Add them in Products, or scan a barcode.','هێشتا کاڵا نییە. لە بەشی کاڵاکان زیادی بکە یان بارکۆد سکان بکە.'],
code:['Barcode','بارکۆد'],name:['Product name','ناوی کاڵا'],cost:['Cost price (original)','نرخی کڕین (ئەسڵی)'],price:['Selling price','نرخی فرۆشتن'],
costkg:['Cost price per kg','نرخی کڕین بۆ کیلۆیەک'],pricekg:['Selling price per kg','نرخی فرۆشتن بۆ کیلۆیەک'],stock:['Stock (optional)','بڕی ماوە (ئارەزوومەندانە)'],
byw:['Sold by weight (kg)','بە کێش دەفرۆشرێت (کیلۆ)'],save:['Save product','پاشەکەوتکردنی کاڵا'],edit:['Edit','دەستکاری'],sure:['Sure?','دڵنیایت؟'],
print:['🖨 Print','🖨 چاپکردن'],done:['Done','تەواو'],today:['Today','ئەمڕۆ'],week:['7 days','٧ ڕۆژ'],month:['This month','ئەم مانگە'],all:['All time','هەموو کات'],
rev:['Sales','فرۆشتن'],cst:['Cost','تێچوو'],profit:['Profit','قازانج'],cnt:['sales','فرۆشتن'],csv:['Export CSV','هەناردەی CSV'],bak:['Backup','پاشەکەوت'],res:['Restore','گەڕاندنەوە'],
store:['Shop name','ناوی دووکان'],curr:['Currency','دراو'],since:['Records since','تۆمارکردن لە'],synced:['Synced','هاوکاتکراو'],local:['This device only','تەنیا ئەم ئامێرە'],
kg:['kg','کگ'],custom:['Other weight (kg)','کێشی تر (کگ)'],daily:['Daily summary','کورتەی ڕۆژانە'],recent:['Recent sales','فرۆشتنە دوایینەکان'],view:['View','بینین'],
np:['Name and selling price are required','ناو و نرخی فرۆشتن پێویستە'],saved:['Saved','پاشەکەوت کرا'],newc:['New barcode – add the product','بارکۆدی نوێ – کاڵاکە زیاد بکە'],
low:['Cash received is less than total','پارەی وەرگیراو کەمترە لە کۆی گشتی'],camf:['Camera unavailable: ','کامێرا بەردەست نییە: '],stop:['Stop camera','وەستاندنی کامێرا'],
left:['left','ماوە'],notr:['stock not tracked','بڕ تۆمار ناکرێت'],nocode:['no barcode','بێ بارکۆد'],paste:['Choose or paste a backup (replaces current data):','باکئەپ هەڵبژێرە یان دابنێ (داتای ئێستا دەگۆڕێت):'],
inv:['Invalid backup','باکئەپەکە هەڵەیە'],copy:['Copy','کۆپی'],close:['Close','داخستن'],cancel:['Cancel','پاشگەزبوونەوە'],thanks:['Thank you!','سوپاس!'],paid:['Paid','دراو'],margin:['margin','قازانج'],photo:['🖼 Photo','🖼 وێنە'],nobar:['No barcode found – take a closer, sharper photo','بارکۆد نەدۆزرایەوە – وێنەیەکی نزیکتر و ڕوونتر بگرە'],camdeny:['Camera blocked. Use the Photo button, or allow the camera in browser site settings.','کامێرا بلۆک کراوە. دوگمەی وێنە بەکاربهێنە یان لە ڕێکخستنەکانی وێبگەڕ ڕێگە بدە.']};
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){}};
let lang=ls('cashier-lang')||'en';const t=k=>L[k][lang==='ku'?1:0];
const blank=()=>({cur:'IQD',store:'My Shop',products:[],sales:[],since:new Date().toISOString(),u:0});
let db=blank(),cart=[],sc=null,last='',lastT=0,cdb=null,cur='sell',per='t';
try{const r=ls('cashier-v1');if(r)db=Object.assign(blank(),JSON.parse(r))}catch(e){}
if(db.sales.length&&db.since>db.sales[0].t)db.since=db.sales[0].t;
const saveL=()=>ls('cashier-v1',JSON.stringify(db));
function push(){db.u=Date.now();saveL();if(cdb)cdb.doc('shop/main').set({products:db.products,store:db.store,cur:db.cur,since:db.since,del:db.del||[],u:db.u}).catch(()=>chip(false))}
const n2=v=>(+v||0).toLocaleString('en-US',{maximumFractionDigits:2}),money=v=>n2(v)+' '+db.cur;
const fr={.25:'¼',.5:'½',.75:'¾'},fq=(q,w)=>w?(fr[q]||n2(q))+' '+t('kg'):q;
function toast(m){const e=$('#toast');e.textContent=m;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();a.close()},90)}catch(e){}}
const modal=h=>{$('#mb').innerHTML=h;$('#md').hidden=false},closeM=()=>$('#md').hidden=true;
$('#md').onclick=e=>{if(e.target.id==='md')closeM()};
function chip(ok){$('#sync').textContent=ok?'● '+t('synced'):'○ '+t('local')}

/* language */
function applyLang(){const k=lang==='ku';document.documentElement.dir=k?'rtl':'ltr';document.documentElement.lang=k?'ckb':'en';
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
 document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=t(e.dataset.p));
 $('#lang').textContent=k?'English':'کوردی';chip(!!cdb);plab();refresh()}
$('#lang').onclick=()=>{lang=lang==='ku'?'en':'ku';ls('cashier-lang',lang);applyLang()};

/* camera */
async function startScan(cb,once){await stopScan();$('#cam').hidden=false;
 try{sc=new Html5Qrcode('reader');await sc.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:150}},txt=>{
  const n=Date.now();if(txt===last&&n-lastT<1500)return;last=txt;lastT=n;beep();cb(txt);if(once)stopScan()},()=>{})
 }catch(e){stopScan();camErr(e)}}
async function camErr(e){const m=String(e&&(e.name||e.message)||e);let w='prompt';
 try{const p=document.permissionsPolicy||document.featurePolicy;if(p&&p.allowsFeature&&!p.allowsFeature('camera'))w='host'}catch(_){}
 if(w!=='host'&&!window.isSecureContext)w='http';
 if(w==='prompt'){try{const q=await navigator.permissions.query({name:'camera'});if(q.state==='denied')w='denied'}catch(_){}}
 if(w==='prompt'&&/NotFound/.test(m))w='none';else if(w==='prompt'&&/NotReadable|Abort/.test(m))w='busy';
 modal(`<p>${t('cw_'+w)}</p><small style="direction:ltr">[${esc(w)}] ${esc(m).slice(0,120)}</small><div class="row" style="margin:12px 0 0"><button class="pri" onclick="closeM();$('#photoBtn').click()">${t('photo')}</button><button onclick="closeM()">${t('close')}</button></div>`)}
async function stopScan(){if(sc){try{await sc.stop();sc.clear()}catch(e){}sc=null}$('#cam').hidden=true}
$('#camStop').onclick=stopScan;
let photoCb=null;
function photo(cb){photoCb=cb;$('#pf').value='';$('#pf').click()}
$('#pf').onchange=async e=>{const f=e.target.files[0];if(!f||!photoCb)return;try{const h=new Html5Qrcode('reader');const code=await h.scanFile(f,false);try{h.clear()}catch(_){}beep();photoCb(code)}catch(err){toast(t('nobar'))}};
$('#photoBtn').onclick=()=>photo(code=>{const p=db.products.find(p=>p.code===code);if(p)pick(p);else unknown(code)});
$('#pphoto').onclick=()=>photo(c=>{$('#pc').value=c;$('#pn').focus()});

/* nav */
function view(v){cur=v;['sell','prod','sales'].forEach(x=>$('#v-'+x).hidden=x!==v);
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));stopScan();refresh()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>view(b.dataset.v));
function refresh(){$('#sn').textContent=db.store;document.title=db.store;$('#set-store').value=db.store;$('#set-cur').value=db.cur;
 if(cur==='sell'){rList();rCart()}if(cur==='prod')rProd();if(cur==='sales')rSales()}

/* sell */
const unitTxt=p=>money(p.price)+(p.w?' / '+t('kg'):'');
const stTxt=p=>p.stock===''||p.stock==null?'':' · '+n2(p.stock)+(p.w?' '+t('kg'):'')+' '+t('left');
function rList(){const q=$('#q').value.trim().toLowerCase();
 const l=db.products.filter(p=>!q||p.name.toLowerCase().includes(q)||p.code.includes(q)).slice(0,60);
 $('#list').innerHTML=l.length?l.map(p=>`<button class="pb" data-id="${p.id}"><span>${esc(p.name)}</span><small>${unitTxt(p)}${stTxt(p)}</small></button>`).join(''):`<p class="mu">${t('nop')}</p>`}
$('#list').onclick=e=>{const b=e.target.closest('.pb');if(b)pick(db.products.find(p=>p.id==b.dataset.id))};
$('#q').oninput=rList;
$('#q').onkeydown=e=>{if(e.key!=='Enter')return;const v=$('#q').value.trim();if(!v)return;
 const p=db.products.find(p=>p.code===v);if(p){pick(p);$('#q').value='';rList();return}
 const m=db.products.filter(p=>p.name.toLowerCase().includes(v.toLowerCase()));
 if(m.length===1){pick(m[0]);$('#q').value='';rList()}else if(!m.length)unknown(v)};
$('#scanBtn').onclick=()=>startScan(code=>{const p=db.products.find(p=>p.code===code);if(p)pick(p);else unknown(code)});
function unknown(code){view('prod');$('#pc').value=code;$('#pn').focus();toast(t('newc'))}
function pick(p){if(!p)return;if(!p.w)return add(p,1);
 modal(`<h3 style="margin:0">${esc(p.name)}</h3><small>${unitTxt(p)}</small><div class="wg">${[.25,.5,1].map(k=>`<button class="pri" data-k="${k}">${fq(k,1)}<small style="color:inherit">${money(p.price*k)}</small></button>`).join('')}</div><div class="row"><input id="wk" type="number" step="0.05" min="0" inputmode="decimal" placeholder="${t('custom')}"><button id="wadd">OK</button></div>`);
 $('#mb').onclick=e=>{const b=e.target.closest('[data-k]');if(b){add(p,+b.dataset.k);closeM()}else if(e.target.id==='wadd'){const k=parseFloat($('#wk').value);if(k>0){add(p,k);closeM()}}}}
function add(p,q){const c=cart.find(x=>x.id===p.id);c?c.q=+(c.q+q).toFixed(3):cart.push({id:p.id,n:p.name,p:p.price,c:p.cost||0,w:!!p.w,q});rCart()}
const sub=()=>cart.reduce((s,c)=>s+c.p*c.q,0),tot=()=>Math.max(0,sub()-(+$('#disc').value||0));
function rCart(){
 $('#lines').innerHTML=cart.length?cart.map((c,i)=>`<div class="ln"><div>${esc(c.n)}<small>${money(c.p)}${c.w?' / '+t('kg'):''}</small></div><div class="qt"><button data-a="m" data-i="${i}">−</button><b>${fq(c.q,c.w)}</b><button data-a="p" data-i="${i}">+</button></div><div class="lt">${money(c.p*c.q)}</div><button class="x" data-a="d" data-i="${i}">✕</button></div>`).join(''):`<p class="mu">${t('empty')}</p>`;
 const x=tot(),pd=$('#paid').value;$('#tot').textContent=money(x);$('#chg').textContent=pd!==''?money(Math.max(0,pd-x)):'—'}
$('#lines').onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=+b.dataset.i,c=cart[i],st=c.w?.25:1,a=b.dataset.a;
 if(a==='p')c.q=+(c.q+st).toFixed(3);else if(a==='m')c.q=+(c.q-st).toFixed(3);else c.q=0;if(c.q<=0)cart.splice(i,1);rCart()};
$('#disc').oninput=$('#paid').oninput=rCart;
$('#clr').onclick=()=>{cart=[];$('#disc').value=$('#paid').value='';rCart()};
$('#pay').onclick=()=>{if(!cart.length)return toast(t('empty'));
 const x=tot(),pd=$('#paid').value===''?x:+$('#paid').value;if(pd<x)return toast(t('low'));
 const s={id:Date.now(),t:new Date().toISOString(),items:cart.map(c=>({id:c.id,n:c.n,p:c.p,c:c.c,q:c.q,w:c.w})),disc:+$('#disc').value||0,total:x,cost:cart.reduce((a,c)=>a+c.c*c.q,0),paid:pd};
 cart.forEach(c=>{const p=db.products.find(y=>y.id===c.id);if(p&&p.stock!==''&&p.stock!=null)p.stock=Math.max(0,+(p.stock-c.q).toFixed(3))});
 db.sales.push(s);push();if(cdb)cdb.collection('sales').doc(String(s.id)).set(s).catch(()=>{});
 cart=[];$('#disc').value=$('#paid').value='';rCart();rList();receipt(s)};
function receipt(s,canDel){modal(`<div id="rcp"><h3 style="margin:0">${esc(db.store)}</h3><small>${new Date(s.t).toLocaleString()}</small><hr>${s.items.map(i=>`<div class="r"><span>${esc(i.n)} ×${fq(i.q,i.w)}</span><span>${money(i.p*i.q)}</span></div>`).join('')}<hr>${s.disc?`<div class="r"><span>${t('disc')}</span><span>−${money(s.disc)}</span></div>`:''}<div class="r"><b>${t('total')}</b><b>${money(s.total)}</b></div><div class="r"><span>${t('paid')}</span><span>${money(s.paid)}</span></div><div class="r"><span>${t('chg')}</span><span>${money(s.paid-s.total)}</span></div><p style="text-align:center">${t('thanks')}</p></div><div class="row" style="margin:12px 0 0"><button class="pri" onclick="window.print()">${t('print')}</button><button onclick="closeM()">${t('done')}</button>${canDel?`<button class="x" id="delS">${t('del')}</button>`:''}</div>`);if(canDel)$('#delS').onclick=function(){if(!this.dataset.s){this.dataset.s=1;this.textContent=t('sure');return}delSale(s.id);closeM()}}

/* products */
function plab(){const w=$('#pw').checked;$('#lc').textContent=t(w?'costkg':'cost');$('#lp').textContent=t(w?'pricekg':'price')}
$('#pw').onchange=plab;
function rProd(){$('#plist').innerHTML=db.products.map(p=>{const m=p.price>0&&p.cost>0?' · '+t('margin')+' '+Math.round((p.price-p.cost)/p.price*100)+'%':'';
 return `<div class="ln"><div>${esc(p.name)}<small>${esc(p.code)||t('nocode')} · ${t('cost')} ${n2(p.cost)} → ${unitTxt(p)}${m}</small><small>${stTxt(p).slice(3)||t('notr')}</small></div><div class="lt"></div><button data-a="e" data-id="${p.id}">${t('edit')}</button><button class="x" data-a="r" data-id="${p.id}">✕</button></div>`}).join('')||`<p class="mu">${t('nop')}</p>`}
$('#plist').onclick=e=>{const b=e.target.closest('button');if(!b)return;const p=db.products.find(x=>x.id==b.dataset.id);if(!p)return;
 if(b.dataset.a==='e'){$('#pid').value=p.id;$('#pc').value=p.code;$('#pn').value=p.name;$('#pk').value=p.cost||'';$('#pp').value=p.price;$('#ps').value=p.stock;$('#pw').checked=!!p.w;plab();scrollTo(0,0)}
 else if(b.dataset.sure){db.products=db.products.filter(x=>x!==p);push();rProd()}else{b.dataset.sure=1;b.textContent=t('sure')}};
$('#pscan').onclick=()=>startScan(c=>{$('#pc').value=c;$('#pn').focus()},true);
const pclr=()=>{['#pid','#pc','#pn','#pk','#pp','#ps'].forEach(s=>$(s).value='');$('#pw').checked=false;plab()};$('#pclr').onclick=pclr;
$('#psave').onclick=()=>{const n=$('#pn').value.trim(),price=parseFloat($('#pp').value);if(!n||isNaN(price))return toast(t('np'));
 const code=$('#pc').value.trim(),st=$('#ps').value.trim();
 let p=db.products.find(x=>x.id==$('#pid').value)||(code&&db.products.find(x=>x.code===code));if(!p){p={id:Date.now()};db.products.push(p)}
 Object.assign(p,{code,name:n,price,cost:parseFloat($('#pk').value)||0,w:$('#pw').checked,stock:st===''?'':+st});push();pclr();rProd();toast(t('saved'))};

/* records */
function from(){const n=new Date(),s=new Date(n.getFullYear(),n.getMonth(),n.getDate());if(per==='w')s.setDate(s.getDate()-6);if(per==='m')s.setDate(1);return per==='a'?0:+s}
function rSales(){document.querySelectorAll('#per button').forEach(b=>b.classList.toggle('on',b.dataset.k===per));
 const l=db.sales.filter(s=>+new Date(s.t)>=from()),rev=l.reduce((a,s)=>a+s.total,0),cs=l.reduce((a,s)=>a+(s.cost||0),0);
 $('#stats').innerHTML=[['rev',money(rev)],['cst',money(cs)],['profit',money(rev-cs)],['cnt',l.length]].map(([k,v])=>`<div class="tile"><small>${t(k)}</small><b${k==='profit'?' style="color:var(--ac)"':''}>${v}</b></div>`).join('');
 $('#since').textContent=t('since')+': '+new Date(db.since).toLocaleDateString();
 const d={};l.forEach(s=>{const k=new Date(s.t).toLocaleDateString(),o=d[k]||(d[k]={n:0,r:0,p:0});o.n++;o.r+=s.total;o.p+=s.total-(s.cost||0)});
 $('#dlist').innerHTML=Object.entries(d).reverse().map(([k,o])=>`<div class="ln" style="grid-template-columns:1fr auto auto"><div>${k}<small>${o.n} ${t('cnt')}</small></div><div class="lt">${money(o.r)}</div><div class="lt" style="color:var(--ac)">${money(o.p)}</div></div>`).join('')||'<p class="mu">—</p>';
 $('#slist').innerHTML=l.slice(-40).reverse().map(s=>`<div class="ln" style="grid-template-columns:1fr auto auto"><div>${new Date(s.t).toLocaleString()}<small>${s.items.length} · ${t('profit')} ${money(s.total-(s.cost||0))}</small></div><div class="lt">${money(s.total)}</div><button data-id="${s.id}">${t('view')}</button></div>`).join('')||'<p class="mu">—</p>'}
$('#per').onclick=e=>{const b=e.target.closest('button');if(b){per=b.dataset.k;rSales()}};
$('#slist').onclick=e=>{const b=e.target.closest('button');if(b)receipt(db.sales.find(s=>s.id==b.dataset.id),true)};
async function saveFile(name,text){
 if(!window.claude){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download=name;a.click();return}
 try{const d=await claude.use('downloads');if(d){await d.save({filename:name,data:text});return}}catch(e){if(e&&e.code==='declined')return}
 modal(`<textarea id="ta" rows="10" readonly>${esc(text)}</textarea><div class="row" style="margin:10px 0 0"><button class="pri" onclick="$('#ta').select();document.execCommand('copy')">${t('copy')}</button><button onclick="closeM()">${t('close')}</button></div>`)}
const q2=v=>'"'+String(v).replace(/"/g,'""')+'"',day=()=>new Date().toISOString().slice(0,10);
$('#bcsv').onclick=()=>{const r=['date,item,qty,unit,sell_price,cost_price,revenue,cost,profit'];
 db.sales.forEach(s=>s.items.forEach(i=>r.push([q2(new Date(s.t).toLocaleString()),q2(i.n),i.q,i.w?'kg':'pc',i.p,i.c||0,i.p*i.q,(i.c||0)*i.q,(i.p-(i.c||0))*i.q].join(','))));
 saveFile('sales-'+day()+'.csv','\ufeff'+r.join('\n'))};
$('#bbak').onclick=()=>saveFile('cashier-backup-'+day()+'.json',JSON.stringify(db));
$('#bres').onclick=()=>{modal(`<p>${t('paste')}</p><input type="file" id="rf" accept=".json" style="margin-bottom:8px"><textarea id="ta" rows="6"></textarea><div class="row" style="margin:10px 0 0"><button class="pri" id="dores">${t('res')}</button><button onclick="closeM()">${t('cancel')}</button></div>`);
 $('#rf').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(x=>$('#ta').value=x)};
 $('#dores').onclick=()=>{try{const d=JSON.parse($('#ta').value);if(!Array.isArray(d.products))throw 0;db=Object.assign(blank(),d);push();closeM();refresh();toast(t('saved'))}catch(e){toast(t('inv'))}}};
function undoStock(s){s.items.forEach(i=>{const p=db.products.find(y=>y.id===i.id)||db.products.find(y=>y.name===i.n);if(p&&p.stock!==''&&p.stock!=null)p.stock=+(p.stock+i.q).toFixed(3)})}
function delSale(id){const s=db.sales.find(x=>x.id===id);if(!s)return;undoStock(s);db.sales=db.sales.filter(x=>x.id!==id);(db.del=db.del||[]).push(id);push();if(cdb)cdb.collection('sales').doc(String(id)).delete().catch(()=>{});refresh()}
$('#wipe').onclick=function(){if(!this.dataset.s){this.dataset.s=1;this.textContent=t('sure');return}
 const ids=db.sales.map(x=>x.id);db.sales.forEach(undoStock);db.del=(db.del||[]).concat(ids);db.sales=[];db.since=new Date().toISOString();push();
 if(cdb)ids.forEach(id=>cdb.collection('sales').doc(String(id)).delete().catch(()=>{}));
 this.dataset.s='';this.textContent=t('wipe');refresh()};
$('#set-store').onchange=e=>{db.store=e.target.value.trim()||'My Shop';push();refresh()};
$('#set-cur').onchange=e=>{db.cur=e.target.value.trim()||'IQD';push();refresh()};

/* sync across devices (needs the signed-in Claude page; otherwise stays local) */
async function initSync(){try{if(!window.claude)return;cdb=await claude.use('db');if(!cdb)return;let first=true;
 cdb.doc('shop/main').onSnapshot(s=>{const d=s.exists?s.data():null;
  if(!d){if(db.products.length||db.sales.length)push()}
  else if((d.u||0)>(db.u||0)){db.products=d.products||[];db.store=d.store||db.store;db.cur=d.cur||db.cur;db.since=d.since||db.since;db.del=[...new Set([...(db.del||[]),...(d.del||[])])];db.sales=db.sales.filter(x=>!db.del.includes(x.id));db.u=d.u;saveL();refresh()}
  else if(first&&(d.u||0)<(db.u||0))push();
  first=false;chip(true)},()=>chip(false));
 cdb.collection('sales').onSnapshot(s=>{const have=new Set(db.sales.map(x=>x.id)),rem=new Set();let ch=false;
  s.docs.forEach(x=>{const v=x.data();rem.add(v.id);if(!have.has(v.id)&&!(db.del||[]).includes(v.id)){db.sales.push(v);ch=true}});
  db.sales.forEach(x=>{if(!rem.has(x.id))cdb.collection('sales').doc(String(x.id)).set(x).catch(()=>{})});
  if(ch){db.sales.sort((a,b)=>a.id-b.id);saveL();refresh()}},()=>{});
}catch(e){}}
applyLang();initSync();
</script></body></html>
